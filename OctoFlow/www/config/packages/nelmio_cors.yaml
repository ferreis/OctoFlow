nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_credentials: true
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-API-KEY', 'X-CSRF-Token', 'X-CSRF-Action', 'X-Tab-Id', 'X-Browser-Id', 'X-Browser-Fingerprint', 'X-Client-Location']
        expose_headers: ['Link', 'Retry-After']
        max_age: 3600
    paths:
        '^/': null
