name: octoflow

services:
  backend:
    container_name: octoflow-backend
    hostname: octoflow-backend
    build:
      context: . # path do build
      dockerfile: docker/php/Dockerfile
    image: php-fpm # faz um cross validate
    volumes:
      - ./www:/var/www/html
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ../data/ftp:/ftp
      - ../data/ftp_persistent:/ftp_persistent
    depends_on:
      - database
    networks:
      - octoflow-network

  frontend:
    container_name: octoflow-frontend
    hostname: octoflow-frontend
    build:
      context: .
      dockerfile: docker/nodejs/Dockerfile
    image: nodejs
    restart: unless-stopped
    volumes:
      - ./frontend:/home/node/app
      - ../data/temp:/temp
    depends_on:
      - backend
    networks:
      - octoflow-network

  #Server pages
  nginx:
    container_name: octoflow-nginx
    hostname: octoflow-nginx
    restart: always
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    image: nginx
    depends_on:
      - frontend
      - backend
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /var/www/cert/nginx-selfsigned.crt ] || [ ! -f /var/www/cert/nginx-selfsigned.key ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 825 \
            -keyout /var/www/cert/nginx-selfsigned.key \
            -out /var/www/cert/nginx-selfsigned.crt \
            -subj '/C=BR/ST=SP/L=SaoPaulo/O=OctoFlow/OU=Dev/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,DNS:nginx,IP:127.0.0.1'
          chmod 600 /var/www/cert/nginx-selfsigned.key
          chmod 644 /var/www/cert/nginx-selfsigned.crt
        fi
        exec nginx -g 'daemon off;'
    volumes:
      - ./www_nginx:/var/www/html
      - ../data/cert_nginx:/var/www/cert
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d     

    ports:
      - "4481:443"
    networks:
      - octoflow-network

  database:
    container_name: octoflow-database
    hostname: octoflow-database
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    build:
      context: .
      dockerfile: docker/pg/Dockerfile
    volumes:
      - ../data/pg/PostgreSql-Snippets/infile:/infile
      - ../data/pg/pg_data:/var/lib/postgresql/data
      - ../data/tempdb:/tempdb
      - ../data/temp:/temp
    ports:
      - "14953:5432"
    networks:
      - octoflow-network

  mailcatcher:
    image: dockage/mailcatcher:latest
    container_name: octoflow-mailcatcher
    hostname: mailcatcher
    restart: unless-stopped
    ports:
      - "11081:1080"
    networks:
      - octoflow-network

networks:
  octoflow-network:
    name: octoflow-network
    driver: bridge
