name: octoflow

services:
  backend:
    container_name: octoflow-backend
    hostname: octoflow-backend
    build:
      context: . # path do build
      dockerfile: docker/php/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: php-fpm # faz um cross validate
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    volumes:
      - ./www:/var/www/html
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ../data/ftp:/ftp
      - ../data/ftp_persistent:/ftp_persistent
    depends_on:
      - database
      - redis
    networks:
      - octoflow-network

  frontend:
    container_name: octoflow-frontend
    hostname: octoflow-frontend
    build:
      context: .
      dockerfile: docker/nodejs/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: nodejs
    restart: unless-stopped
    volumes:
      - ./frontend:/home/node/app
      - ../data/temp:/temp
    depends_on:
      - backend
    networks:
      - octoflow-network

  #Server pages
  nginx:
    container_name: octoflow-nginx
    hostname: octoflow-nginx
    restart: on-failure:5
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: nginx
    depends_on:
      - frontend
      - backend
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -f /var/www/cert/nginx-selfsigned.crt ] || [ ! -f /var/www/cert/nginx-selfsigned.key ]; then
          openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 825 \
            -keyout /var/www/cert/nginx-selfsigned.key \
            -out /var/www/cert/nginx-selfsigned.crt \
            -subj '/C=BR/ST=SP/L=SaoPaulo/O=OctoFlow/OU=Dev/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,DNS:nginx,IP:127.0.0.1'
          chmod 600 /var/www/cert/nginx-selfsigned.key
          chmod 644 /var/www/cert/nginx-selfsigned.crt
        fi
        chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /var/www/cert
        exec nginx -g 'daemon off;'
    volumes:
      - ./www_nginx:/var/www/html
      - ../data/cert_nginx:/var/www/cert
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "4481:443"
    networks:
      - octoflow-network

  database:
    container_name: octoflow-database
    hostname: octoflow-database
    image: postgres:16
    restart: on-failure:5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no ambiente local}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-octoflow}
    build:
      context: .
      dockerfile: docker/pg/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(tr -d '\r\n' < /run/secrets/postgres_password)"
        if [ "$${POSTGRES_USER}" = "root" ]; then
          echo "POSTGRES_USER=root não é permitido. Use um usuário dedicado ao OctoFlow." >&2
          exit 1
        fi
        if [ "$${#password}" -lt 24 ]; then
          echo "A senha do PostgreSQL deve ter pelo menos 24 caracteres." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - ../data/pg/PostgreSql-Snippets/infile:/infile
      - ../data/pg/pg_data:/var/lib/postgresql/data
      - ../data/tempdb:/tempdb
      - ../data/temp:/temp
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-14954}:5432"
    secrets:
      - postgres_password
    networks:
      - octoflow-network

  mailcatcher:
    image: dockage/mailcatcher:latest
    container_name: octoflow-mailcatcher
    hostname: mailcatcher
    restart: on-failure:5
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:11081:1080"
    networks:
      - octoflow-network

  redis:
    container_name: octoflow-redis
    hostname: octoflow-redis
    restart: on-failure:5
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - octoflow-network

networks:
  octoflow-network:
    name: octoflow-network
    driver: bridge

volumes:
  redis-data:
    name: octoflow-redis-data

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Defina POSTGRES_PASSWORD_FILE apontando para um arquivo local fora do Git}
